name: 'Setup PHP and Composer with Cache'
description: 'Set up PHP, cache composer dependencies, and install them'

inputs:
  php-version:
    description: 'PHP version to set up'
    required: true
  php-extensions:
    description: 'PHP extensions to install'
    required: true
  working-directory:
    description: 'Working directory for composer'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}

    - name: Get Composer Cache Directory
      id: composer-cache
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles(format('{0}/composer.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: composer install --prefer-dist --no-progress
