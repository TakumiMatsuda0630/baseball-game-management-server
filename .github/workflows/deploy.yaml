name: Build and Push Docker Image

on:
  push:
    branches:
      - '**' # TODO 後でmasterに書き換える.

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Actionsのサーバーにソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v7

      # ビルドキャッシュを使えるようにするエンジンを起動
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 2. GitHub Packages (GHCR) にログイン
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. コンテナイメージの「タグ（名前）」を生成
      - name: Downcase repository name
        id: string
        run: |
          echo "repo_name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      # 4. DockerコンテナをビルドしてGHCRに送信
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app/production/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.repo_name }}:latest
          # ビルドを高速化するためのキャッシュ設定
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. デプロイ先のRenderのWebhookにリクエストし、Renderでデプロイコマンドを実行
      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
